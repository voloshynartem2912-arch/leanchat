<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>leanchat</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a2030">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --bg: #1a2030;
    --panel: #232b3f;
    --line: #34405b;
    --text: #e9edf6;
    --dim: #93a0bd;
    --accent: #f0b24a;
    --accent-ink: #2a1d05;
    --danger: #e8776b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  input, select, button { font: inherit; color: inherit; }
  input, select {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; min-width: 0;
  }
  button {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.live { background: var(--danger); border-color: var(--danger); color: #2b0a06; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* avatars */
  .av {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background-size: cover; background-position: center;
    font-weight: 600; color: #fff; border: 1px solid var(--line); padding: 0;
  }
  button.av { width: 42px; height: 42px; }

  #login { margin: auto; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 10px; }
  #login h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  #login p { margin: 0 0 8px; color: var(--dim); }
  #err { color: var(--danger); min-height: 1.4em; }
  #err.info { color: var(--dim); }

  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
  header select { flex: 1; }

  /* host panel */
  #admin { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; max-height: 30vh; overflow-y: auto; }
  #pending:empty { display: none; }
  #pending .arow { color: var(--accent); }
  #admin summary { cursor: pointer; color: var(--dim); }
  .arow { display: flex; align-items: center; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
  .arow span { flex: 1; min-width: 120px; overflow-wrap: anywhere; }
  .arow button { padding: 6px 10px; }

  #voicebar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #vtext { flex: 1; min-width: 140px; color: var(--dim); font-size: 14px; }
  #vstat { flex-basis: 100%; color: var(--dim); font-size: 13px; }
  #vstat.bad { color: var(--danger); }
  #hidelbl { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
  #hidelbl input { padding: 0; width: 16px; height: 16px; accent-color: var(--accent); }

  #screens {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); max-height: 45vh; overflow-y: auto;
  }
  .scr { margin: 0; min-width: 0; }
  .scr.screen { grid-column: 1 / -1; }
  .scr video { width: 100%; background: #000; border-radius: 8px; }
  .scr.screen video { max-height: 36vh; object-fit: contain; }
  .scr.cam video { aspect-ratio: 4 / 3; object-fit: cover; }
  .scr.self video { transform: scaleX(-1); }
  .scr figcaption { color: var(--dim); font-size: 13px; padding-top: 4px; }

  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 10px; align-items: flex-start; }
  .m .body { min-width: 0; overflow-wrap: anywhere; }
  .m b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .m time { color: var(--dim); font-size: 12px; }
  #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #composer input { flex: 1; }
</style>
</head>
<body>

<form id="login">
  <h1>leanchat</h1>
  <p>Text, voice and video for a few people.</p>
  <input id="server" placeholder="Server (example: chat.mysite.com)" autocomplete="off">
  <input id="name" placeholder="Your name (leave blank for a random one)" autocomplete="off" maxlength="24">
  <input id="pass" type="password" placeholder="Password">
  <button class="primary" type="submit">Join</button>
  <div id="err" role="alert"></div>
</form>

<div id="app" class="hidden">
  <header>
    <button id="me" class="av" type="button" title="Change your picture" aria-label="Change your picture"></button>
    <select id="chsel" aria-label="Channel"></select>
    <button id="exp" type="button" title="Save all chats as a text file">Export</button>
  </header>
  <div id="admin" class="hidden">
    <div id="pending"></div>
    <details><summary>People (you are the host)</summary><div id="mlist"></div></details>
  </div>
  <div id="voicebar">
    <span id="vtext">Nobody in voice</span>
    <button id="vbtn" type="button">Join voice</button>
    <button id="cbtn" type="button" class="hidden">Camera</button>
    <button id="sbtn" type="button" class="hidden">Share screen</button>
    <label id="hidelbl" title="Other people will not see your IP address; calls go through the TURN relay">
      <input id="hideip" type="checkbox"> Hide my IP
    </label>
    <div id="vstat" class="hidden" aria-live="polite"></div>
  </div>
  <div id="screens" class="hidden"></div>
  <div id="msgs" aria-live="polite"></div>
  <form id="composer">
    <input id="text" placeholder="Message" autocomplete="off" maxlength="2000">
    <button class="primary" type="submit">Send</button>
  </form>
</div>
<input id="file" type="file" accept="image/*" class="hidden">

<script>
// ---- Config ---------------------------------------------------------------
// ICE servers normally come from the server (ICE_SERVERS env var, sent in the welcome message).
// This is only the fallback: STUN alone does not work for everyone, a TURN server is needed.
let ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const hasTurn = () => ICE.iceServers.some((s) => [].concat(s.urls || []).some((u) => /^turns?:/i.test(u)));

// ---- State ----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let ws, myId, myName, channel = 'general', history = {}, avatars = {}, amHost = false;
let local = null;     // mic stream while in voice
let cam = null;       // our camera stream while it is on
let screen = null;    // our screen-share stream while sharing
const pcs = {};       // peerId -> RTCPeerConnection
const audios = {};    // peerId -> Audio element
const tiles = {};     // key -> <figure> showing someone's camera or screen
const kinds = {};     // peerId -> { streamId: 'cam' | 'screen' }
const voiceNames = {};// peerId -> name

const HAS_MEDIA = !!navigator.mediaDevices?.getUserMedia;
const CAN_SHARE = !!navigator.mediaDevices?.getDisplayMedia && !/Android|iPhone|iPad/i.test(navigator.userAgent);
const okImg = (s) => typeof s === 'string' && s.length < 40000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);

// A random token stays in this browser. The server uses it (not the name) to know who has been let in.
function getToken() {
  let t = store.get('lc_token');
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(t || '')) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    t = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
    store.set('lc_token', t);
  }
  return t;
}
function setInfo(text, bad) {
  $('err').textContent = text;
  $('err').classList.toggle('info', !!text && !bad);
}

if (location.protocol.startsWith('http')) $('server').value = location.host;
$('name').value = store.get('lc_name') || '';
$('hideip').checked = store.get('lc_hideip') === '1';
$('hideip').addEventListener('change', () => store.set('lc_hideip', $('hideip').checked ? '1' : '0'));

// ---- Login ----------------------------------------------------------------
$('login').addEventListener('submit', (e) => {
  e.preventDefault();
  setInfo('');
  const host = $('server').value.trim();
  if (!host) { setInfo('Enter the server address.', true); return; }
  const secure = location.protocol === 'https:' || !/^(localhost|127\.|192\.168\.|10\.)/.test(host);
  try { ws?.close(); } catch {}
  let sock;
  try { sock = new WebSocket((secure ? 'wss://' : 'ws://') + host); }
  catch { setInfo('Could not open that address.', true); return; }
  ws = sock;
  store.set('lc_name', $('name').value);
  sock.onopen = () => sock.send(JSON.stringify({
    t: 'join', name: $('name').value.trim().slice(0, 24), pass: $('pass').value, token: getToken(),
  }));
  sock.onmessage = (ev) => {
    if (sock !== ws) return;
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    onMsg(m);
  };
  sock.onerror = () => { if (sock === ws && !myId) setInfo('Could not connect.', true); };
  sock.onclose = () => {
    if (sock !== ws) return;
    if (myId) location.reload();
    else if (!$('err').textContent || $('err').classList.contains('info')) setInfo('Disconnected. Press Join to try again.', true);
  };
});

// ---- Incoming messages ----------------------------------------------------
function onMsg(m) {
  if (m.t === 'error') { setInfo(m.text, true); }
  else if (m.t === 'wait') {
    setInfo(m.hostOnline
      ? 'Waiting for the host to let you in...'
      : 'The host is not online right now. You will get in once they approve you.');
  }
  else if (m.t === 'welcome') {
    myId = m.id; myName = m.name || myName || 'anon'; history = m.history;
    if (Array.isArray(m.ice) && m.ice.length) ICE = { iceServers: m.ice };
    if (!hasTurn()) {
      $('hideip').checked = false; $('hideip').disabled = true;
      $('hidelbl').title = 'Needs a TURN server (set ICE_SERVERS on the server)';
    }
    avatars = {};
    for (const [n, img] of Object.entries(m.avatars || {})) if (okImg(img)) avatars[n] = img;
    $('chsel').replaceChildren(...m.channels.map((c) => new Option('# ' + c, c)));
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('me').dataset.name = myName; paintAvatar($('me'), myName);
    const saved = store.get('lc_avatar');
    if (okImg(saved) && avatars[myName] !== saved) ws.send(JSON.stringify({ t: 'avatar', img: saved }));
    setHost(m.host);
    renderVoice(m.voice); renderChannel();
  }
  else if (m.t === 'role') { setHost(m.host); }
  else if (m.t === 'admin') { renderAdmin(m); }
  else if (m.t === 'msg') {
    (history[m.ch] ||= []).push(m.msg);
    if (m.ch === channel) addMsg(m.msg);
  }
  else if (m.t === 'avatar') {
    if (okImg(m.img)) { avatars[m.name] = m.img; repaint(m.name); }
  }
  else if (m.t === 'voice') { renderVoice(m.list); syncPeers(m.list); }
  else if (m.t === 'sig') { sigQueue = sigQueue.then(() => onSig(m.from, m.data)).catch(() => {}); }
}
let sigQueue = Promise.resolve();

// ---- Host panel (the first person in decides who else may enter) -----------
function setHost(on) {
  amHost = !!on;
  $('admin').classList.toggle('hidden', !amHost);
  if (!amHost) { $('pending').replaceChildren(); $('mlist').replaceChildren(); document.title = 'leanchat'; }
}
function arow(text, buttons) {
  const d = document.createElement('div'); d.className = 'arow';
  const s = document.createElement('span'); s.textContent = text; d.append(s);
  buttons.forEach(([label, act, id, cls]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.act = act; b.dataset.id = id;
    if (cls) b.className = cls;
    d.append(b);
  });
  return d;
}
function renderAdmin(d) {
  if (!amHost) return;
  $('pending').replaceChildren(...d.pending.map((p) =>
    arow(p.name + ' wants to join', [['Allow', 'allow', p.id, 'primary'], ['Deny', 'deny', p.id]])));
  $('mlist').replaceChildren(...d.members.map((m) =>
    arow(m.name + (m.host ? ' (host)' : '') + (m.id === myId ? ' (you)' : ''),
      m.host ? [] : [['Make host', 'host', m.id], ['Remove', 'kick', m.id]])));
  document.title = d.pending.length ? '(' + d.pending.length + ') leanchat' : 'leanchat';
}
$('admin').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b || !amHost) return;
  if (b.dataset.act === 'kick' && !confirm('Remove this person? They will need your approval to come back.')) return;
  ws.send(JSON.stringify({ t: 'admin', act: b.dataset.act, id: Number(b.dataset.id) }));
});

// ---- Avatars --------------------------------------------------------------
function hue(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360; return h; }
function paintAvatar(el, name) {
  const img = avatars[name];
  if (img) {
    el.textContent = '';
    el.style.backgroundColor = '';
    el.style.backgroundImage = 'url("' + img + '")';
  } else {
    el.style.backgroundImage = '';
    el.style.backgroundColor = 'hsl(' + hue(name) + ' 40% 38%)';
    el.textContent = (Array.from(name.trim())[0] || '?').toUpperCase();
  }
}
function avatarEl(name) {
  const el = document.createElement('span');
  el.className = 'av'; el.dataset.name = name; paintAvatar(el, name);
  return el;
}
function repaint(name) {
  document.querySelectorAll('.av').forEach((el) => { if (el.dataset.name === name) paintAvatar(el, name); });
}
$('me').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    const S = 96, side = Math.min(bmp.width, bmp.height);
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, S, S);
    const img = c.toDataURL('image/jpeg', 0.8);
    store.set('lc_avatar', img);
    ws.send(JSON.stringify({ t: 'avatar', img }));
  } catch { alert('Could not use that picture.'); }
});

// ---- Text chat ------------------------------------------------------------
function addMsg(msg) {
  const box = $('msgs');
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const d = document.createElement('div'); d.className = 'm';
  const body = document.createElement('div'); body.className = 'body';
  const head = document.createElement('div');
  const b = document.createElement('b'); b.textContent = msg.name;
  const t = document.createElement('time');
  t.textContent = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  head.append(b, t);
  const s = document.createElement('div'); s.textContent = msg.text;
  body.append(head, s);
  d.append(avatarEl(msg.name), body); box.append(d);
  if (stick) box.scrollTop = box.scrollHeight;
}
function renderChannel() {
  $('msgs').replaceChildren();
  (history[channel] || []).forEach(addMsg);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
$('chsel').addEventListener('change', (e) => { channel = e.target.value; renderChannel(); });
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ t: 'msg', ch: channel, text }));
  $('text').value = '';
});

// ---- Export ---------------------------------------------------------------
$('exp').addEventListener('click', () => {
  const parts = Object.keys(history).map((c) =>
    '# ' + c + '\n' + history[c].map((m) => '[' + new Date(m.ts).toLocaleString() + '] ' + m.name + ': ' + m.text).join('\n'));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([parts.join('\n\n')], { type: 'text/plain;charset=utf-8' }));
  a.download = 'leanchat-export.txt';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// ---- Voice (WebRTC mesh; the server only relays signaling) ----------------
function renderVoice(list) {
  Object.keys(voiceNames).forEach((k) => delete voiceNames[k]);
  list.forEach((p) => { voiceNames[p.id] = p.name; });
  $('vtext').textContent = list.length ? 'In voice: ' + list.map((p) => p.name).join(', ') : 'Nobody in voice';
  updateStat();
}
const sig = (to, data) => ws.send(JSON.stringify({ t: 'sig', to, data }));

$('vbtn').addEventListener('click', async () => {
  if (local) return leaveVoice();
  try {
    local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    alert('Could not use the microphone: ' + err.message + '\nVoice needs https (or localhost), and a normal browser (not the one inside Telegram or Instagram).');
    return;
  }
  ws.send(JSON.stringify({ t: 'voice', on: true }));
  $('vbtn').textContent = 'Leave voice'; $('vbtn').classList.add('live');
  $('hideip').disabled = true;
  if (HAS_MEDIA) $('cbtn').classList.remove('hidden');
  if (CAN_SHARE) $('sbtn').classList.remove('hidden');
});

function leaveVoice() {
  stopShare(); stopCam();
  local.getTracks().forEach((t) => t.stop()); local = null;
  Object.keys(pcs).forEach(closePeer);
  ws.send(JSON.stringify({ t: 'voice', on: false }));
  $('vbtn').textContent = 'Join voice'; $('vbtn').classList.remove('live');
  $('cbtn').classList.add('hidden'); $('sbtn').classList.add('hidden');
  $('hideip').disabled = !hasTurn();
}

function closePeer(id) {
  pcs[id]?.close(); delete pcs[id];
  if (audios[id]) { audios[id].srcObject = null; delete audios[id]; }
  delete kinds[id];
  hideVideosOf(id);
  updateStat();
}

// Shows the connection state with each person, so a failure is visible instead of silent.
function updateStat() {
  const el = $('vstat');
  const relay = $('hideip').checked;
  const rows = Object.entries(pcs).map(([id, pc]) => {
    const s = pc.connectionState;
    const who = voiceNames[id] || 'Someone';
    if (s === 'connected') return who + ': connected';
    if (s === 'failed') return who + ': FAILED (' + (relay ? 'the TURN relay is not reachable, check ICE_SERVERS' : 'no direct route, a TURN server is needed') + ')';
    if (s === 'disconnected') return who + ': reconnecting...';
    return who + ': connecting...';
  });
  el.textContent = rows.join(' | ');
  el.classList.toggle('hidden', !rows.length);
  el.classList.toggle('bad', rows.some((r) => r.includes('FAILED')));
}

// Browsers block audio until the page is touched; retry playback on any tap.
document.addEventListener('click', () => {
  Object.values(audios).forEach((a) => { if (a.paused) a.play().catch(() => {}); });
});

// The peer with the higher id places the first call; after that either side can renegotiate.
function syncPeers(list) {
  if (!local) return;
  const ids = new Set(list.map((p) => String(p.id)));
  Object.keys(pcs).forEach((id) => { if (!ids.has(id)) closePeer(id); });
  list.forEach((p) => { if (p.id < myId && !pcs[p.id]) makePc(p.id); });
}

// Camera and screen are extra video tracks. Before sending one we tell the other side
// which stream is which (meta message), so they can show a camera tile or a screen tile.
function addMediaTo(pc, kind) {
  const stream = kind === 'cam' ? cam : screen;
  sig(pc._id, { meta: { [stream.id]: kind } });
  pc._m[kind] = stream.getTracks().map((t) => pc.addTrack(t, stream));
}
function removeMediaFrom(pc, kind) {
  pc._m[kind].forEach((s) => { try { pc.removeTrack(s); } catch {} });
  pc._m[kind] = [];
}

// "Perfect negotiation": lets both sides add or remove tracks (like a screen) at any time.
function makePc(id) {
  // "Hide my IP" forces everything through the TURN relay, so other people only see the relay's address.
  const pc = new RTCPeerConnection({ ...ICE, iceTransportPolicy: $('hideip').checked ? 'relay' : 'all' });
  pcs[id] = pc;
  const st = { polite: myId < id, making: false, ignore: false };
  pc._st = st; pc._id = id; pc._m = { cam: [], screen: [] }; pc._retries = 0;
  local.getTracks().forEach((t) => pc.addTrack(t, local));
  if (screen) addMediaTo(pc, 'screen');
  if (cam) addMediaTo(pc, 'cam');
  pc.onnegotiationneeded = async () => {
    try { st.making = true; await pc.setLocalDescription(); sig(id, { sdp: pc.localDescription }); }
    catch {} finally { st.making = false; }
  };
  pc.onicecandidate = (e) => e.candidate && sig(id, { ice: e.candidate });
  pc.onconnectionstatechange = () => {
    updateStat();
    if (pc.connectionState === 'failed' && pc._retries < 2) { pc._retries++; try { pc.restartIce(); } catch {} }
  };
  updateStat();
  pc.ontrack = (e) => {
    if (e.track.kind === 'audio') {
      const a = audios[id] ||= new Audio();
      a.autoplay = true; a.srcObject = e.streams[0] || new MediaStream([e.track]); a.play().catch(() => {});
    } else {
      const stream = e.streams[0] || new MediaStream([e.track]);
      const kind = (kinds[id] || {})[stream.id] || 'screen';
      const key = id + ':' + stream.id;
      const show = () => {
        const who = voiceNames[id] || 'Someone';
        showVideo(key, id, kind, stream, kind === 'cam' ? who : who + ' is sharing. Tap the video for fullscreen.');
      };
      e.track.onunmute = show;
      e.track.onmute = () => hideVideo(key);
      e.track.onended = () => hideVideo(key);
      if (!e.track.muted) show();
    }
  };
  return pc;
}

async function onSig(from, d) {
  if (d.meta && typeof d.meta === 'object') {
    const k = kinds[from] ||= {};
    for (const [sid, kind] of Object.entries(d.meta)) if (kind === 'cam' || kind === 'screen') k[sid] = kind;
    return;
  }
  if (!local) return;
  let pc = pcs[from];
  if (!pc) {
    if (d.sdp?.type !== 'offer') return;
    pc = makePc(from);
  }
  const st = pc._st;
  if (d.sdp) {
    const collision = d.sdp.type === 'offer' && (st.making || pc.signalingState !== 'stable');
    st.ignore = !st.polite && collision;
    if (st.ignore) return;
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer') {
      await pc.setLocalDescription();
      sig(from, { sdp: pc.localDescription });
    }
  } else if (d.ice) {
    try { await pc.addIceCandidate(d.ice); } catch (err) { if (!st.ignore) throw err; }
  }
}

// ---- Camera ---------------------------------------------------------------
$('cbtn').addEventListener('click', async () => {
  if (cam) return stopCam();
  if (!local) return;
  try {
    cam = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } }, audio: false,
    });
  } catch (err) { cam = null; alert('Could not use the camera: ' + err.message); return; }
  cam.getVideoTracks()[0].onended = stopCam;
  Object.values(pcs).forEach((pc) => addMediaTo(pc, 'cam'));
  showVideo('me:cam', 'me', 'cam', cam, 'You', true);
  $('cbtn').textContent = 'Camera off'; $('cbtn').classList.add('live');
});
function stopCam() {
  if (!cam) return;
  Object.values(pcs).forEach((pc) => removeMediaFrom(pc, 'cam'));
  cam.getTracks().forEach((t) => t.stop()); cam = null;
  hideVideo('me:cam');
  $('cbtn').textContent = 'Camera'; $('cbtn').classList.remove('live');
}

// ---- Screen sharing (desktop browsers share; phones can still watch) -------
$('sbtn').addEventListener('click', async () => {
  if (screen) return stopShare();
  if (!local) return;
  try {
    screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 15, width: { max: 1280 } }, audio: false });
  } catch { screen = null; return; }
  screen.getVideoTracks()[0].onended = stopShare;
  Object.values(pcs).forEach((pc) => addMediaTo(pc, 'screen'));
  $('sbtn').textContent = 'Stop sharing'; $('sbtn').classList.add('live');
});
function stopShare() {
  if (!screen) return;
  Object.values(pcs).forEach((pc) => removeMediaFrom(pc, 'screen'));
  screen.getTracks().forEach((t) => t.stop()); screen = null;
  $('sbtn').textContent = 'Share screen'; $('sbtn').classList.remove('live');
}

// ---- Video tiles (cameras and shared screens) ------------------------------
function showVideo(key, peer, kind, stream, label, self) {
  let box = tiles[key];
  if (!box) {
    box = document.createElement('figure');
    box.className = 'scr ' + kind + (self ? ' self' : '');
    box.dataset.peer = String(peer);
    const v = document.createElement('video');
    v.autoplay = true; v.muted = true; v.playsInline = true;
    v.addEventListener('click', () => v.requestFullscreen?.());
    box.append(v, document.createElement('figcaption'));
    $('screens').append(box); tiles[key] = box;
  }
  box.firstChild.srcObject = stream;
  box.lastChild.textContent = label;
  $('screens').classList.remove('hidden');
}
function hideVideo(key) {
  const box = tiles[key];
  if (!box) return;
  box.remove(); delete tiles[key];
  if (!$('screens').children.length) $('screens').classList.add('hidden');
}
function hideVideosOf(peer) {
  Object.keys(tiles).forEach((k) => { if (tiles[k].dataset.peer === String(peer)) hideVideo(k); });
}
